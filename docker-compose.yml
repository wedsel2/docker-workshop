version: "3.9"

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: wedsel2/docker-workshop-db:16
    environment:
      POSTGRES_DB: moviereviews
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: wedsel2/docker-workshop-webapp:1.0.0
    depends_on:
      - db
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
