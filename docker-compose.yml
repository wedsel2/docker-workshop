version: "3.9"

services:
  db:
    image: wedsel2/docker-workshop-db:latest
    environment:
      POSTGRES_DB: moviereviews
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
  web:
    image: wedsel2/docker-workshop-webapp:latest
    depends_on:
      - db
    environment:
      DB_HOST: db
    ports:
      - "80:8000"
